name: Build and Deploy mar-lidar-service (RPi ARM64)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build on Self-Hosted Raspberry Pi
    runs-on: [self-hosted, linux, arm64]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image on RPi
        run: |
          echo "Building mar-lidar-service on Raspberry Pi ARM64..."
          docker build -t mar-lidar-service:latest .

      - name: Trigger Kubernetes Rollout Restart
        run: |
          if command -v kubectl >/dev/null 2>&1 && kubectl cluster-info >/dev/null 2>&1; then
            echo "Applying update to Kubernetes deployment..."
            kubectl set env deployment/mar-lidar-service LIDAR_SIMULATE=false LIDAR_PORT=/dev/ttyAMA0 LIDAR_BAUD=230400 LIDAR_OFFSET_DEG=90.0 -n mar-system || true
            kubectl rollout restart deployment/mar-lidar-service -n mar-system || true
            kubectl rollout status deployment/mar-lidar-service -n mar-system --timeout=60s || true
            echo "=== Pi Hardware Serial Devices ==="
            ls -la /dev/serial* /dev/ttyAMA* /dev/ttyUSB* /dev/ttyACM* 2>/dev/null || true
            echo "=== mar-lidar-service Logs ==="
            sleep 3
            kubectl logs deployment/mar-lidar-service -n mar-system --tail=30 || true
          else
            echo "Kubernetes (K3s) not available yet. Image cached in local Docker daemon."
          fi
